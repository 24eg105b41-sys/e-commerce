version: '3.8'

services:
  # MySQL 8.x Database
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shopsphere_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - shopsphere_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  # Spring Boot 3 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shopsphere_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopsphere.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@Campus2026}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - shopsphere-network

  # React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - shopsphere-network

volumes:
  shopsphere_mysql_data:
    driver: local

networks:
  shopsphere-network:
    driver: bridge
